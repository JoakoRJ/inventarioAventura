{% extends 'base_dashboard.html' %}

{% block title %}Mi Perfil{% endblock %}

{% block contenido %}
<h1 class="h3 mb-4 text-gray-800">Mi Perfil</h1>

<div class="row">
    <div class="col-xl-4 col-lg-5 mb-4">
        <div class="card shadow h-100">
            <div class="card-body text-center">
                <i class="fas fa-user-circle fa-5x text-success mb-3"></i>
                <h5 class="font-weight-bold text-gray-900">{{ user.get_full_name|default:user.username }}</h5>
                <p><span class="badge badge-success">{{ perfil.get_rol_display }}</span></p>
                <p class="small text-muted mb-0">Usuario: {{ user.username }}</p>
            </div>
        </div>
    </div>
    <div class="col-xl-8 col-lg-7 mb-4">
        <div class="card shadow">
            <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-success">Mis datos</h6></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Guardar cambios</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
